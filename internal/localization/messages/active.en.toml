[CustomPricePrompt]
other = "<b>Custom price</b>\n\nEnter a minimum and maximum separated by a hyphen. You can use <code>k</code> for thousands.\n\n<b>Examples</b>\n<code>300-700</code> — From €300 to €700\n<code>-700</code> — From €0 to €700\n<code>500-</code> or <code>500+</code> — From €500 with no maximum\n<code>100000-200000</code> — From €100,000 to €200,000\n<code>100k-200k</code> — Same as €100,000 to €200,000\n<code>100k+</code> — From €100,000 with no maximum\n\nSend the price range as your next message."

[CustomSizePrompt]
other = "<b>Custom size</b>\n\nExamples: <code>40-80</code>, <code>50-</code>, <code>-70</code>\n\nSend the size range as your next message."

